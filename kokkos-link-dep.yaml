---
spack:
  concretizer:
    reuse: false
    unify: true
  mirrors:
    local-buildcache:
      url: oci://ghcr.io/tpadioleau/test-kokkos-spack-ubuntu-26.04
      binary: true
      source: false
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  packages:
    all:
      prefer:
        - 'target=x86_64'
        - '~cuda'
        - '~rocm'
        - '~openmp'
        - '~mpi'
        - '~fortran'
    c:
      require: 'gcc@15.2'
    cxx:
      require: 'gcc@15.2'
    fortran:
      require: 'gcc@15.2'
  repos:
    my-builtin:
      git: https://github.com/tpadioleau/spack-packages.git
      branch: link-dep
  specs:
    - 'gcc@15.2'
    - 'cmake@4.3'
    - 'kokkos@5.1'
  view:
    default:
      projections:
        all: "{name}-{version}-{hash}"
      root: .spack-env/view
