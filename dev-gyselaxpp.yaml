---
spack:
  concretizer:
    reuse: false
    unify: true
  config:
    sandbox:
      enable: true
      allow_network: true
      allow_read:
        - /
      allow_write:
        - /home/runner
  mirrors:
    local-buildcache:
      url: oci://ghcr.io/tpadioleau/dev-spack-ubuntu-26.04
      binary: true
      source: false
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  packages:
    all:
      require:
        - 'target=x86_64'
      prefer:
        - '~cuda'
        - '~rocm'
        - '~openmp'
        - '~mpi'
        - '~fortran'
    c:
      require: 'gcc@15.2'
    cxx:
      require: 'gcc@15.2'
    fortran:
      require: 'gcc@15.2'
    py-dask:
      prefer:
        - '~dataframe'
    py-pandas:
      prefer: 
        - '~performance'
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2026.10
    builtin:
      branch: releases/v2026.10
  specs:
    - 'gcc@15.2'
    - 'cmake@4.4'
    - 'ddc@0.16 +fft +pdi +splines'
    - 'ginkgo@1.11'
    - 'gmgpolar@2.3'
    - 'googletest@1.18 +gmock'
    - 'kokkos@5.2'
    - 'kokkos-kernels@5.2'
    - 'kokkos-tools@5.2'
    - 'koliop@0.2'
    - 'ninja@1.13'
    - 'openblas@0.3'
    - 'openmpi@5.0'
    - 'paraconf@1.0'
    - 'pdi@1.11'
    - 'pdiplugin-decl-hdf5@1.11 +mpi'
    - 'pdiplugin-decl-netcdf@1.11 +mpi'
    - 'pdiplugin-mpi@1.11'
    - 'pdiplugin-pycall@1.11'
    - 'py-dask@2026.3 +distributed'
    - 'py-gysmc'
    - 'py-h5py@3.16'
    - 'py-imageio@2.37'
    - 'py-matplotlib@3.11'
    - 'py-netcdf4@1.7'
    - 'py-numexpr@2.14'
    - 'py-numpy@2.4'
    - 'py-psutil@7.2'
    - 'py-pyyaml@6.0'
    - 'py-xarray@2026.4 +io +parallel'
  view:
    default:
      projections:
        all: "{name}-{version}-{hash}"
      root: .spack-env/view
