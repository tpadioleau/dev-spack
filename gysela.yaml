---
spack:
  concretizer:
    reuse: false
    unify: true
  config:
    sandbox:
      enable: true
      allow_network: true
      allow_read:
        - /
      allow_write:
        - /home/runner
        - /dev
  mirrors:
    local-buildcache:
      url: oci://ghcr.io/tpadioleau/develop-ubuntu-26.04
      binary: true
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  packages:
    all:
      require:
        - 'target=x86_64'
      prefer:
        - '~cuda'
        - '~rocm'
        - '~openmp'
        - '~mpi'
        - '~fortran'
    c:
      require: 'gcc@15.2'
    cxx:
      require: 'gcc@15.2'
    fortran:
      require: 'gcc@15.2'
    py-dask:
      prefer:
        - '~dataframe'
    py-pandas:
      prefer:
        - '~performance'
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2026.06
    tpadioleau-builtin:
      git: https://github.com/tpadioleau/spack-packages.git
      branch: test-all-packages
    builtin:
      branch: develop
  specs:
    - 'ddc'
    - 'fmt'
    - 'ginkgo'
    - 'gmgpolar'
    - 'gyselalibxx'
    - 'gysela-mini-app-io'
    - 'hdf5 +mpi +shared'
    - 'kokkos'
    - 'kokkos-fft'
    - 'kokkos-tools'
    # - 'kokkos-kernels', some tests do not link without some ETI
    - 'kokkos-kernels +execspace_serial'
    # - 'koliop', tests consume too much memory
    # - 'mdspan', no releases
    - 'mdspan@stable'
    - 'netcdf-c'
    - 'openblas'
    - 'paraconf'
    - 'pdi'
    - 'pdiplugin-decl-hdf5'
    - 'pdiplugin-decl-netcdf'
    - 'pdiplugin-mpi'
    - 'pdiplugin-pycall'
    - 'pdiplugin-serialize'
    - 'pdiplugin-set-value'
    - 'pdiplugin-trace'
    - 'pdiplugin-user-code'
    # - 'py-numpy', error: ModuleNotFoundError: No module named 'numpy'
    - 'spdlog'
  view:
    default:
      projections:
        all: "{name}-{version}-{hash}"
      root: .spack-env/view
