---
spack:
  concretizer:
    reuse: false
    unify: true
  config:
    sandbox:
      enable: true
      allow_network: false
      allow_read:
        - /
      allow_write:
        - /home/runner
  mirrors:
    local-buildcache:
      url: oci://ghcr.io/tpadioleau/dev-spack-ubuntu-26.04
      binary: true
      source: false
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  packages:
    all:
      require:
        - 'target=x86_64'
      prefer:
        - '~cuda'
        - '~rocm'
        - '~openmp'
        - '~mpi'
        - '~fortran'
    c:
      require: 'gcc@15.2'
    cxx:
      require: 'gcc@15.2'
    fortran:
      require: 'gcc@15.2'
  repos:
    builtin:
      branch: releases/v2026.10
  specs:
    - 'gcc@15.2'
    - 'benchmark@1.9 ~performance_counters'
    - 'cmake@4.4'
    - 'doxygen@1.17'
    - 'googletest@1.18'
    - 'hdf5@1.14 +mpi'
    - 'kokkos@5.2'
    - 'kokkos-tools@5.2'
    - 'ninja@1.13'
    - 'openmpi@5.0'
    - 'paraconf@1.0'
    - 'pdi@1.11'
    - 'pdiplugin-decl-hdf5@1.11 +mpi'
    - 'pdiplugin-mpi@1.11'
    - 'pdiplugin-set-value@1.11'
    - 'pdiplugin-trace@1.11'
    - 'py-h5py@3.16'
    - 'py-matplotlib@3.11'
    - 'py-numpy@2.4'
    - 'py-pyyaml@6.0'
    - 'py-scipy'
  view:
    default:
      projections:
        all: "{name}-{version}-{hash}"
      root: .spack-env/view
