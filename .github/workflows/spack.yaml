---
name: Build Spack env

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-spack-env:
    strategy:
      fail-fast: false
      matrix:
        env:
          - kokkos-cuda.yaml
        os: [ubuntu-26.04]
    runs-on: ${{matrix.os}}
    permissions:
      packages: write  # Required to push to registry
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          large-packages: false
      - name: Checkout built branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Spack
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3  # v3.0.0
        with:
          spack_ref: v1.2.2
          buildcache: true
      - name: Prepare environment
        shell: spack-bash {0}
        run: |
          spack bootstrap now
          spack env create . ${{matrix.env}}
          spack --env . config add config:install_tree:padded_length:128
          spack --env . repo update
          spack --env . buildcache list
      - name: Install
        shell: spack-bash {0}
        run: |
          spack --env . concretize
          mkdir tmp_spack
          export TMPDIR=$PWD/tmp_spack
          spack --env . install --fail-fast --include-build-deps --show-log-on-error
