---
name: Build Spack env

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-spack-env:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    runs-on: ${{matrix.os}}
    permissions:
      packages: write  # Required to push to registry
    steps:
      - name: Checkout built branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Spack
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3  # v3.0.0
        with:
          spack_ref: v1.2.2
          buildcache: true
      - name: Install
        shell: spack-bash {0}
        run: |
          spack env create dev-gmgpolar dev-gmgpolar.yaml
          spack --env dev-gmgpolar repo update
          spack --env dev-gmgpolar install
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: gyselax/spack
          path: gyselax-spack
          ref: releases/v2026.06
      - name: Install GMGPolar
        shell: spack-bash {0}
        run: |
          spack env create gmgpolar
          spack --env gmgpolar repo add gyselax-spack/spack_repo/patches_common
          spack --env gmgpolar add gmgpolar
          spack --env gmgpolar install
